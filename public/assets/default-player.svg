<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="100%" stop-color="#0e1017"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9442"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff7a18" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="16" fill="url(#bgGrad)" stroke="rgba(255,122,24,0.25)" stroke-width="2"/>
  
  <!-- Ambient subtle glow circle -->
  <circle cx="60" cy="52" r="38" fill="url(#glowGrad)"/>
  
  <!-- Stylized Basketball Player Silhouette -->
  <!-- Head -->
  <circle cx="60" cy="38" r="14" fill="url(#orangeGrad)"/>
  
  <!-- Jersey / Shoulders -->
  <path d="M 34 84 C 34 62, 45 56, 52 54 L 54 62 L 66 62 L 68 54 C 75 56, 86 62, 86 84 C 86 86, 84 88, 80 88 L 40 88 C 36 88, 34 86, 34 84 Z" fill="url(#orangeGrad)"/>
  
  <!-- Jersey collar cutout -->
  <path d="M 52 54 C 54 60, 66 60, 68 54 Z" fill="#1e222d"/>
  
  <!-- Subtle basketball icon watermark on jersey bottom right -->
  <circle cx="60" cy="74" r="5" fill="none" stroke="#161922" stroke-width="1.2"/>
  <line x1="55" y1="74" x2="65" y2="74" stroke="#161922" stroke-width="1"/>
  <line x1="60" y1="69" x2="60" y2="79" stroke="#161922" stroke-width="1"/>
</svg>
